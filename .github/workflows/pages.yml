# Publishes the mod's web page to GitHub Pages: https://ajac-zero.github.io/power-suits/
# site/ is a template; tools/build-site.py fills it in for the latest release (version, links, "coming in" badges).
# Runs on every push to main that touches the page, after every release (the Release workflow starts it), or by hand.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/build-site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the page for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/build-site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
