# Builds a release on GitHub's servers and publishes it, so the jar players download comes from the public source and
# a public build log, not from anyone's computer.
#
# Run it by hand (Actions tab > Release > Run workflow, or `gh workflow run release.yml -f tag=v1.1.0`) after pushing a
# tag. It checks out the TAG (not main), so it also releases tags from before this workflow existed (v1.0.0).
#
# What it publishes on the release:
#   - the mod jar, built with tools/reproducible.gradle (rebuild the tag yourself and you get the same bytes)
#   - <jar>.sha256, its checksum
#   - a signed build provenance attestation (Sigstore, stored by GitHub): proof that this exact file was built by this
#     workflow in this repository from that commit. Check a download with
#       gh attestation verify powerarmor-1.0.0.jar -R ajac-zero/power-suits
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.1.0); push it first"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: false
        default: ""

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      # The build script and init script come from the workflow's own commit (main), not from the tag.
      - name: Check out the release tools
        uses: actions/checkout@v4
        with:
          path: .release-tools
          sparse-checkout: tools/reproducible.gradle
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true # a release is built from scratch, nothing reused from earlier runs

      - name: The tag must match mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "::error::tag ${{ inputs.tag }} but gradle.properties says mod_version=$version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --init-script .release-tools/tools/reproducible.gradle --no-daemon --no-configuration-cache --no-build-cache

      - name: Checksum
        run: |
          cd build/libs
          ls -l
          sha256sum "powerarmor-$VERSION.jar" | tee "powerarmor-$VERSION.jar.sha256"

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/libs/powerarmor-${{ env.VERSION }}.jar

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          sum=$(cut -d' ' -f1 "build/libs/powerarmor-$VERSION.jar.sha256")
          {
            [ -n "$NOTES" ] && printf '%s\n\n' "$NOTES"
            echo "Needs NeoForge for Minecraft 26.3 and GeckoLib 5 (server and client)."
            echo
            echo "**SHA-256** \`$sum\`"
            echo
            echo "Built by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from the tag ${{ inputs.tag }}."
            echo "Check your download: \`gh attestation verify powerarmor-$VERSION.jar -R $GITHUB_REPOSITORY\`"
          } > notes.md
          gh release create "${{ inputs.tag }}" \
            "build/libs/powerarmor-$VERSION.jar" "build/libs/powerarmor-$VERSION.jar.sha256" \
            --title "Power Armor $VERSION" --notes-file notes.md --verify-tag
