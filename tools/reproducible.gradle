// Gradle init script: makes the mod jar come out byte for byte the same on every machine, so anyone can rebuild a
// release from its tag and compare checksums with the published jar (see "Verify your download" on the web page).
//
//   git checkout v1.1.0
//   ./gradlew clean build --init-script tools/reproducible.gradle      (any checkout of this file works)
//   shasum -a 256 build/libs/powersuits-1.1.0.jar
// Use a fresh clone or a clean checkout: an empty folder left in src/ by a rename (git doesn't track empty folders)
// still becomes a jar entry and changes the checksum.
//
// Jars are zip files, and by default a zip records each file's modification time and the order the file system lists
// files in: two builds of the same code then differ. These settings write fixed timestamps and sort the entries.
// The release workflow builds every release with this script; build.gradle has the same settings.
allprojects {
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
