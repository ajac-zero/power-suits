<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Power Suits</title>
  <meta name="description" content="In-game screenshots and Blender key art of the Power Suits mod.">
  <link rel="icon" href="img/favicon.png">
  <meta property="og:title" content="Gallery | Power Suits">
  <meta property="og:description" content="In-game screenshots and Blender key art of the Power Suits mod.">
  <meta property="og:image" content="https://ajac-zero.github.io/power-suits/img/containment.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
{{nav}}

<div id="main" class="wrap clearfix">
<h1>Gallery</h1>
<p>The first six are in-game screenshots with the vanilla look and no shaders. The rest are key art, rendered in Blender from the mod's own model. The homages are fan art.</p>
<div class="gallery">
  <a href="img/walk_front.jpg"><img src="img/walk_front.jpg" alt="A blue suit walking across a meadow"></a>
  <a href="img/mine_cockpit.jpg"><img src="img/mine_cockpit.jpg" alt="Drilling into a stone ravine from the cockpit"></a>
  <a href="img/tree_side.jpg"><img src="img/tree_side.jpg" alt="A green suit felling an oak with its chainsaw"></a>
  <a href="img/reef_back.jpg"><img src="img/reef_back.jpg" alt="A yellow tidal suit on a coral reef"></a>
  <a href="img/em_front.jpg"><img src="img/em_front.jpg" alt="A purple suit lifting a creeper with the EM projector"></a>
  <a href="img/dusk_cockpit.jpg"><img src="img/dusk_cockpit.jpg" alt="A red suit's cockpit at dusk"></a>
  <a href="img/suppressing_fire.jpg"><img src="img/suppressing_fire.jpg" alt="A green suit with a Spartan helmet firing its chaingun at night"></a>
  <a href="img/containment.jpg"><img src="img/containment.jpg" alt="An orange suit with a Hunter helmet lifting a slime in a spaceship's cargo bay"></a>
  <a href="img/man_of_tomorrow.jpg"><img src="img/man_of_tomorrow.jpg" alt="A lime suit with a chainsaw leaping at a flying caped fighter"></a>
  <a href="img/big_daddy.jpg"><img src="img/big_daddy.jpg" alt="A brown suit with a drill on the sea floor in front of an ocean monument"></a>
</div>
</div>
<dialog id="viewer"><img alt=""></dialog>
<script>
  // Click a picture to see it full size; click again (or Esc) to close.
  const viewer = document.getElementById("viewer");
  document.querySelectorAll(".gallery a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const img = viewer.querySelector("img");
    img.src = a.href; img.alt = a.querySelector("img").alt;
    viewer.showModal();
  }));
  viewer.addEventListener("click", () => viewer.close());
</script>

{{footer}}
</body>
</html>
