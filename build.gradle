plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Development tools: src/dev/ holds the GameTests, the autopilot scenes, the multiplayer script and the test_pad
// structure. A second source set: it compiles against the mod (main) but isn't packed into the jar players download
// (`jar` only takes main). The runs below load main + dev together as one mod (neoForge.mods), so every dev run
// (runClient, runGameTestServer, runAutopilot...) has them. Entry point: dev/PowerSuitsDev.
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devImplementation.extendsFrom implementation // GeckoLib etc.
    devRuntimeOnly.extendsFrom runtimeOnly
}
// `./gradlew build` compiles the dev tools too (`check` runs as part of build), so a change that breaks the GameTests
// or the autopilot fails the build, not the next test run.
tasks.named('check') { dependsOn tasks.named('devClasses') }

repositories {
    // GeckoLib lives in its own Maven repository
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup("com.geckolib") }
    }
}

base {
    archivesName = jar_name // powersuits-<version>.jar; the mod id stays power_suits (gradle.properties)
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Minecraft + NeoForge on the dev source set's classpath too (main gets them by default).
    addModdingDependenciesTo sourceSets.dev

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dev tool: scripted test drive that saves screenshots to run/screenshots/ap_*.png and quits.
        autopilot {
            client()
            systemProperty 'power_suits.autopilot', 'true'
        }

        // Dev tool: only the last scenes of the autopilot (smashing blocks, stomp, lightning, lava, punch; the machine mind), ~2 min.
        autopilotMech {
            client()
            systemProperty 'power_suits.autopilot', 'mech'
        }

        // Dev tool: only the pose check (torso lean / tool raise / twist from fixed cameras, ap_pose_*.png), ~30 s.
        autopilotPose {
            client()
            systemProperty 'power_suits.autopilot', 'pose'
        }

        // Dev tool: only the foot-slip / leg-turning drive (run/autopilot_gait.csv, tools/gait-report.py), ~45 s.
        autopilotGait {
            client()
            systemProperty 'power_suits.autopilot', 'gait'
        }

        // Dev tool: only the paint scene (all 16 dyes + a wet sponge on a suit, ap_paint_*.png, run/autopilot_paint.csv), ~30 s.
        autopilotPaint {
            client()
            systemProperty 'power_suits.autopilot', 'paint'
        }

        // Dev tool: only the helmet styles scene (five helmets from behind and the front, painted red, the smithing table;
        // ap_style_*.png, ap_menu_smithing.png, run/autopilot_style.csv), ~30 s.
        autopilotStyles {
            client()
            systemProperty 'power_suits.autopilot', 'styles'
        }

        // Dev tool: only the engine scene (flooded firebox, tidal engine in and out of water, star reactor; ap_engine_*.png,
        // run/autopilot_engine.csv), ~35 s.
        autopilotEngine {
            client()
            systemProperty 'power_suits.autopilot', 'engine'
        }

        // Dev tool: only the flamethrower scene (pigs, a plank wall, beef, ice, a campfire; ap_flame_*.png,
        // run/autopilot_flame.csv), ~30 s.
        autopilotFlame {
            client()
            systemProperty 'power_suits.autopilot', 'flame'
        }

        // Dev tool: only the TNT launcher scene (a wall, husks, the drum's turn, the ammo slot; ap_tnt_*.png,
        // ap_menu_ammo.png, run/autopilot_tnt.csv), ~35 s.
        autopilotTnt {
            client()
            systemProperty 'power_suits.autopilot', 'tnt'
        }

        // Dev tool: only the rail cannon scene (glass, husks in a line, a wall, the mind's guard, the ammo slot;
        // ap_rail_*.png, ap_menu_rail.png, run/autopilot_rail.csv), ~35 s.
        autopilotRail {
            client()
            systemProperty 'power_suits.autopilot', 'rail'
        }

        // Dev tool: only the pilot HUD scene (every state the HUD shows, each tool, no helmet; ap_hud_*.png,
        // run/autopilot_hud.csv), ~35 s.
        autopilotHud {
            client()
            systemProperty 'power_suits.autopilot', 'hud'
        }

        // Dev tool: only the suit's inventory screen scene (E inside, F swaps the socket tool, the power switch, the
        // screen from outside; ap_menu_*.png, run/autopilot_menu.csv), ~25 s.
        autopilotMenu {
            client()
            systemProperty 'power_suits.autopilot', 'menu'
        }

        // Dev tool: only the visor's sight in the dark (night vision vs the lamp, a cave and a field at midnight;
        // ap_vision_*.png, run/autopilot_vision.csv), ~40 s.
        autopilotVision {
            client()
            systemProperty 'power_suits.autopilot', 'vision'
        }

        // Dev tool: live-tunes the cockpit viewmodel (see AutoPilot.viewTuner); stays open until closed.
        autopilotView {
            client()
            systemProperty 'power_suits.autopilot', 'view'
        }

        // Dev tool: drives a suit over real terrain in a COPY of run/saves/New World, logs run/autopilot_terrain.csv.
        autopilotTerrain {
            client()
            systemProperty 'power_suits.autopilot', 'terrain:New World'
        }

        // Dev tool: gameplay screenshots for the mod page (client/dev/ShowcaseScene): a fresh seeded world with real
        // terrain, run/screenshots/showcase_*.png at 1920x1080 (960x540 window on a Retina screen), quits by itself.
        showcase {
            client()
            systemProperty 'power_suits.autopilot', 'showcase'
            programArguments.addAll '--width', '960', '--height', '540'
        }


        // Dev tools: multiplayer check. Start runServerMp first, then runMpDriver and runMpWatch (own game dirs inside run/,
        // same machine); the server scripts the story and stops itself. Compare run/mp_server.csv with
        // run/mp-watch/mp_client.csv (there is no report script yet).
        serverMp {
            server()
            programArgument '--nogui'
            systemProperty 'power_suits.mpscript', 'true'
        }
        mpDriver {
            client()
            gameDirectory = project.file('run/mp-driver')
            systemProperty 'power_suits.mp', 'driver'
            programArguments.addAll '--username', 'Driver', '--quickPlayMultiplayer', 'localhost:25565', '--width', '640', '--height', '360'
        }
        mpWatch {
            client()
            gameDirectory = project.file('run/mp-watch')
            systemProperty 'power_suits.mp', 'watch'
            programArguments.addAll '--username', 'Watcher', '--quickPlayMultiplayer', 'localhost:25565', '--width', '960', '--height', '540'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Dev tool: only some GameTests, as often as you like (hunting a flaky one):
        //   ./gradlew runGameTestOnly -Ptests='power_suits:bullethits*' -Prepeat=40
        // (--tests takes the test id with wildcards; ids are the lower-cased method names.)
        gameTestOnly {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--tests', (project.findProperty('tests') ?: 'power_suits:*').toString(),
                    '--repeatCount', (project.findProperty('repeat') ?: '1').toString()
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Every run starts from the dev source set's classpath (main + dev + their libraries): the GameTests and the
            // autopilot are there. The jar players get has none of it.
            sourceSet = sourceSets.dev
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev) // one mod in dev runs: the dev tools' @Mod / @EventBusSubscriber classes are found
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    devRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // GeckoLib 5 makes every vanilla EntityRenderState a GeoRenderState (with a mixin at runtime); this data file
    // tells the compiler the same, so LivingEntityRenderState has addGeckolibData etc. in our code.
    interfaceInjectionData "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Repeatable builds: fixed timestamps and sorted entries in the jar, so the same code always gives the same file and
// anyone can check a release by rebuilding it (the release workflow also passes tools/reproducible.gradle).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
